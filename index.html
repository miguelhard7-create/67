<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>67 Futurista Rápido</title>
    
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="https://i.ibb.co/fGDXNfQL/1775018830768.png">
    <meta name="theme-color" content="#050509">

    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #050509;
            font-family: 'Montserrat', 'Segoe UI', Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Fundo Futurista com Grade */
        body::before {
            content: '';
            position: absolute;
            width: 100%;
            height: 100%;
            background-image: 
                linear-gradient(0deg, transparent 24%, rgba(0, 255, 255, .05) 25%, rgba(0, 255, 255, .05) 26%, transparent 27%, transparent 74%, rgba(0, 255, 255, .05) 75%, rgba(0, 255, 255, .05) 76%, transparent 77%, transparent),
                linear-gradient(90deg, transparent 24%, rgba(0, 255, 255, .05) 25%, rgba(0, 255, 255, .05) 26%, transparent 27%, transparent 74%, rgba(0, 255, 255, .05) 75%, rgba(0, 255, 255, .05) 76%, transparent 77%, transparent);
            background-size: 50px 50px;
            z-index: 0;
            animation: gridPulse 6s ease-in-out infinite;
        }

        body {
            background: radial-gradient(circle at center, #101026 0%, #050509 100%);
        }

        .container {
            text-align: center;
            position: relative;
            z-index: 10;
        }

        .numero-67 {
            font-size: 180px;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: -5px;
            display: inline-block;
            
            background: linear-gradient(90deg, #00ffff, #ff00de, #00ffff);
            background-size: 200% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            
            filter: drop-shadow(0 0 15px rgba(0, 255, 255, 0.7)) drop-shadow(0 0 30px rgba(255, 0, 222, 0.5));
            
            animation: 
                balançoRapido 1s ease-in-out infinite, 
                corNeon 4s linear infinite;
        }

        @keyframes balançoRapido {
            0% { transform: rotate(-20deg) translateY(0); }
            50% { transform: rotate(20deg) translateY(-10px); }
            100% { transform: rotate(-20deg) translateY(0); }
        }

        @keyframes corNeon {
            to { background-position: 200% center; }
        }

        @keyframes gridPulse {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 0.8; }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="numero-67">67</div>
    </div>

    <script>
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('./sw.js')
          .then(() => console.log("Service Worker ativo!"));
      }
    </script>
</body>
</html>
